[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adopt-fpml"
version = "0.1.0"
description = "Automatic discovery of optimal hybrid first-principles–machine-learning models"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  {name = "Angan Mukherjee"},
  {name = "Nishant V. Giridhar"},
  {name = "Debangsu Bhattacharyya"},
]
keywords = ["hybrid modeling", "first principles", "machine learning", "process systems engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=5",
]

[project.scripts]
adopt-fpml = "adopt_fpml.cli:main"

[project.urls]
Homepage = "https://github.com/mukherjeeangan26/ADOPT-FPML"
Documentation = "https://github.com/mukherjeeangan26/ADOPT-FPML/tree/main/docs"
Repository = "https://github.com/mukherjeeangan26/ADOPT-FPML"
Issues = "https://github.com/mukherjeeangan26/ADOPT-FPML/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adopt_fpml = ["data/**/*.csv", "data/**/*.json", "data/**/*.npz"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
